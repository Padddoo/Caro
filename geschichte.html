<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro – Geschichte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 48px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 60px;
        }

        .back {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back:hover { color: #fff; }

        .title-section {
            text-align: right;
        }

        .page-number {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
        }

        .page-title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 300;
            letter-spacing: -0.01em;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-item {
            display: flex;
            align-items: baseline;
            gap: 16px;
            text-decoration: none;
            color: #fff;
            padding: 24px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .section-item:first-child {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-item:hover {
            border-color: rgba(255, 255, 255, 0.35);
        }

        .section-number {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
        }

        .section-info {
            flex: 1;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            margin-bottom: 4px;
        }

        .section-desc {
            font-size: 0.8rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.45);
        }

        .section-arrow {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .section-item:hover .section-arrow {
            color: #fff;
            transform: translateX(4px);
        }

        @media (max-width: 480px) {
            .page { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <a href="index.html" class="back">← Zurück</a>
            <div class="title-section">
                <p class="page-number">01</p>
                <h1 class="page-title">Geschichte</h1>
            </div>
        </div>

        <div class="content">
            <a href="https://youtu.be/tFk7QVXZjw8" target="_blank" rel="noopener" class="section-item">
                <span class="section-number">01.1</span>
                <div class="section-info">
                    <p class="section-title">Erklärvideo</p>
                    <p class="section-desc">Die Französische Revolution</p>
                </div>
                <span class="section-arrow">→</span>
            </a>
        </div>
    </div>
</body>
</html>
