<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="hip-hop-dancer.mov" type="video/quicktime">
    </video>
    <div class="bg-overlay"></div>

    <div class="page">

        <header class="header">
            <span class="wordmark">CARO</span>
        </header>

        <main class="hero">
            <h1 class="hero-title">Caro</h1>
            <p class="hero-status">Under Construction.</p>
            <p class="hero-subtitle">Bald mehr an dieser Stelle.</p>
        </main>

        <section class="cards">
            <a href="#" class="card" onclick="return false">
                <span class="card-number">01</span>
                <span class="card-title">Portfolio</span>
                <span class="card-status">Under Construction</span>
            </a>
            <a href="#" class="card" onclick="return false">
                <span class="card-number">02</span>
                <span class="card-title">Über mich</span>
                <span class="card-status">Under Construction</span>
            </a>
            <a href="#" class="card" onclick="return false">
                <span class="card-number">03</span>
                <span class="card-title">Kontakt</span>
                <span class="card-status">Under Construction</span>
            </a>
        </section>

        <footer class="footer">
            <span class="footer-location">Frankfurt · DE</span>
            <span class="footer-contact">Kontakt folgt</span>
        </footer>

    </div>

</body>
</html>
